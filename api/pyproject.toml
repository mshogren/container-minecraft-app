[project]
name = "container-minecraft-app"
version = "0.0.1"
requires-python = "==3.14.*"
dependencies = [
    "cachetools==7.2.3",
    "docker==7.2.0",
    "kubernetes==37.0.1",
    "packaging==26.3",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "python-jose[cryptography]==3.5.0",
    "strawberry-graphql[cli, fastapi]==0.336.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "autopep8",
    "pylint",
    "pytest",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
